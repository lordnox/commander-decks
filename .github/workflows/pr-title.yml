name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_pr_title.py --self-test
      - run: python3 .github/scripts/check_pr_title.py "${PR_TITLE}"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
