<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table replay</title>
  <style>
    :root {
      --felt: #143d32;
      --ink: #f4efe6;
      --muted: #c5bba8;
      --panel: #0e241e;
      --line: #2a5a4c;
      --header-height: 64px;
      --controls-height: 64px;
      --log-width: 340px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      background: #071410;
      color: var(--ink);
    }
    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      min-height: var(--header-height);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: 0.65rem 1rem;
      background: #0e241ef5;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 18px #0005;
    }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
    header p { margin: 0; color: var(--muted); }
    .header-copy { min-width: 0; overflow: hidden; }
    header h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #subhead {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 72vw;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: none;
    }
    .layout {
      position: fixed;
      inset: var(--header-height) 0 var(--controls-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--log-width);
      min-height: 0;
      transition: grid-template-columns 160ms ease;
    }
    body.log-hidden .layout { grid-template-columns: minmax(0, 1fr) 0; }
    .table {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      display: grid;
      grid-template-areas:
        ". north ."
        "west stack east"
        ". south .";
      grid-template-columns: minmax(230px, 1fr) minmax(220px, 1.1fr) minmax(230px, 1fr);
      grid-template-rows: minmax(220px, 1fr) auto minmax(220px, 1fr);
      gap: 0.6rem;
      padding: 0.75rem;
      background:
        radial-gradient(circle at 50% 50%, #1b5a48 0%, var(--felt) 62%, #0c2a23 100%);
    }
    .seat {
      min-height: 0;
      overflow: auto;
      padding: 0.55rem;
      border: 1px solid color-mix(in srgb, var(--seat, #888) 70%, #000);
      border-radius: 12px;
      background: #0b1f1aee;
    }
    .seat.p1 { grid-area: south; --seat: var(--c1); }
    .seat.p2 { grid-area: west; --seat: var(--c2); }
    .seat.p3 { grid-area: north; --seat: var(--c3); }
    .seat.p4 { grid-area: east; --seat: var(--c4); }
    .seat.active { box-shadow: inset 0 0 0 2px var(--seat); }
    .seat-head {
      position: sticky;
      top: -0.55rem;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: center;
      margin: -0.55rem -0.55rem 0;
      padding: 0.55rem;
      background: #0b1f1af5;
    }
    .life { font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 700; }
    .meta { color: var(--muted); font-size: 12px; }
    .zone { margin-top: 0.35rem; }
    .zone h3 {
      margin: 0 0 0.2rem;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .cards { display: flex; flex-wrap: wrap; gap: 4px; }
    .card {
      position: relative;
      width: 54px;
      border: 1px solid #0006;
      border-radius: 4px;
      background: #111;
    }
    .card img { border-radius: 3px; }
    .pt {
      position: absolute;
      right: 2px;
      bottom: 2px;
      padding: 0 3px;
      border: 1px solid #000;
      border-radius: 3px;
      background: #12100e;
      color: var(--ink);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.35;
      text-shadow: 0 1px 0 #000;
    }
    .pt.modified { background: #4a3a12; color: #ffe9a8; }
    .marks {
      position: absolute;
      left: 2px;
      top: 2px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .mark {
      padding: 0 3px;
      border: 1px solid #000;
      border-radius: 3px;
      background: #12100ee8;
      color: var(--ink);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 1px 0 #000;
    }
    .mark.plus { background: #1d4d31; color: #c7f5d1; }
    .mark.minus { background: #5a2020; color: #ffd2d2; }
    .mark.status { background: #2b2447; color: #ddd2ff; }
    .card.tapped .pt,
    .card.tapped .mark { transform: rotate(-90deg); }
    .card img { display: block; width: 100%; height: auto; }
    .card.tapped { transform: rotate(90deg); transform-origin: center; }
    .card.token { outline: 1px dashed #e6d27a; }
    .zone.revealed h3 { color: #e6d27a; }
    .zone.revealed .cards { padding-left: 0.35rem; border-left: 2px solid #e6d27a88; }
    .center {
      grid-area: stack;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      justify-content: center;
    }
    .now-panel {
      padding: 0.6rem 0.75rem;
      border: 1px solid #e6d27a66;
      border-radius: 10px;
      background: #0b1a16f2;
      box-shadow: 0 6px 22px #0006;
    }
    .now-meta {
      margin: 0 0 0.25rem;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .now-text { margin: 0; color: #f0d9a8; font-size: 1rem; font-weight: 600; }
    .now-note { margin: 0.35rem 0 0; color: var(--muted); font-size: 12px; }
    .now-think { margin: 0.35rem 0 0; color: #c9e4d4; font-size: 12px; }
    .deals-panel {
      padding: 0.45rem 0.6rem;
      border: 1px dashed #7aa89a88;
      border-radius: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .deals-panel h3 { margin: 0 0 0.25rem; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .deals-panel p { margin: 0.2rem 0 0; }
    .stack-panel {
      min-height: 72px;
      padding: 0.5rem;
      border: 1px dashed #e6d27a88;
      border-radius: 10px;
      background: #0b1a16dd;
    }
    .stack-panel h3 {
      margin: 0 0 0.35rem;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .log {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: #0e241efa;
      transition: opacity 120ms ease;
    }
    body.log-hidden .log {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .log h2 { margin: 0; padding: 0.6rem 0.75rem; font-size: 0.85rem; }
    .log ol {
      min-height: 0;
      overflow: auto;
      flex: 1;
      margin: 0;
      padding: 0 0.75rem 0.75rem;
      list-style: none;
    }
    .log li {
      display: flex;
      gap: 0.5rem;
      margin: 0.25rem 0;
      color: var(--muted);
      cursor: pointer;
    }
    .log li.current { color: var(--ink); font-weight: 650; }
    .log-index {
      flex: none;
      width: 3.5ch;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      text-align: right;
    }
    .log-text { min-width: 0; }
    .controls {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      min-height: var(--controls-height);
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.6rem 1rem;
      background: #0e241ef5;
      border-top: 1px solid var(--line);
      box-shadow: 0 -4px 18px #0005;
    }
    .nav-home {
      flex: none;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      background: #1f4f43;
      color: var(--ink);
      text-decoration: none;
    }
    .nav-home:hover, button:hover { background: #2b6657; }
    button {
      flex: none;
      padding: 0.45rem 0.75rem;
      border: 0;
      border-radius: 8px;
      background: #1f4f43;
      color: var(--ink);
      cursor: pointer;
    }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #e6d27a; }
    input[type="range"] { min-width: 120px; flex: 1; }
    #preview {
      position: fixed;
      right: calc(var(--log-width) + 14px);
      bottom: calc(var(--controls-height) + 12px);
      z-index: 30;
      display: none;
      width: 240px;
      border-radius: 10px;
      background: #0b1a16f7;
      box-shadow: 0 8px 30px #000a;
      pointer-events: none;
      overflow: hidden;
    }
    #preview.visible { display: block; }
    #preview img { display: block; width: 100%; height: auto; }
    #preview-detail { padding: 0.45rem 0.55rem; border-top: 1px solid var(--line); }
    #preview-detail:empty { display: none; }
    #preview-detail h4 {
      margin: 0 0 0.25rem;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #preview-detail ul { margin: 0; padding-left: 1rem; }
    #preview-detail li { font-size: 13px; }
    #preview-detail li.plus { color: #c7f5d1; }
    #preview-detail li.minus { color: #ffd2d2; }
    #preview-detail li.status { color: #ddd2ff; }
    body.log-hidden #preview { right: 14px; }
    @media (max-width: 840px) {
      :root { --header-height: 64px; --controls-height: 104px; }
      #clock { display: none; }
      #subhead { max-width: 55vw; }
      .layout { grid-template-columns: minmax(0, 1fr); }
      .table {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
        grid-template-rows: repeat(3, minmax(220px, auto));
        grid-template-areas:
          "north north"
          "west east"
          "south stack";
      }
      .log {
        position: absolute;
        inset: 0 0 0 auto;
        z-index: 15;
        width: min(88vw, var(--log-width));
        box-shadow: -8px 0 24px #0008;
      }
      body.log-hidden .log { transform: translateX(100%); }
      .controls { flex-wrap: wrap; }
      #preview { right: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-copy">
      <h1 id="headline">Table replay</h1>
      <p id="subhead"></p>
    </div>
    <div class="header-actions">
      <p id="clock"></p>
      <a class="nav-home" href="index.html">All games</a>
      <button type="button" id="toggle-log" aria-expanded="true" aria-controls="event-log">Hide log</button>
    </div>
  </header>
  <main class="layout">
    <div class="table" id="table"></div>
    <aside class="log" id="event-log">
      <h2>Event log</h2>
      <ol id="log"></ol>
    </aside>
  </main>
  <div class="controls">
    <button type="button" id="prev">Previous</button>
    <button type="button" id="play">Play</button>
    <button type="button" id="next">Next</button>
    <input type="range" id="slider" min="0" value="0" aria-label="Replay event">
  </div>
  <div id="preview">
    <img id="preview-image" alt="">
    <div id="preview-detail"></div>
  </div>

  <script>
    const GAME = JSON.parse(document.getElementById("game-data").textContent)
    const seats = GAME.seats || []
    const events = GAME.events || []
    const catalog = GAME.catalog || {}
    const tokens = GAME.tokens || {}
    const refs = GAME.references || []
    let index = 0
    let timer = null
    let details = []

    const table = document.getElementById("table")
    const log = document.getElementById("log")
    const slider = document.getElementById("slider")
    const headline = document.getElementById("headline")
    const subhead = document.getElementById("subhead")
    const clock = document.getElementById("clock")
    const toggleLog = document.getElementById("toggle-log")

    headline.textContent = GAME.headline || "Table replay"
    const result = GAME.result || {}
    subhead.textContent = [
      seats.map((seat) => seat.name).join(" · "),
      result.summary || "",
    ].filter(Boolean).join(" — ")
    slider.max = Math.max(0, events.length - 1)

    seats.forEach((seat, i) => {
      document.documentElement.style.setProperty(`--c${i + 1}`, seat.color || "#888")
    })

    const esc = (value) => String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")

    const rowAt = (value) => {
      if (typeof value === "number") return refs[value]
      if (typeof value === "string" && /^\d+$/.test(value)) return refs[Number(value)]
      return undefined
    }

    const label = (value) => {
      const row = rowAt(value)
      if (!row) return value
      if (row.kind === "card" || row.kind === "player") return row.name || value
      return value
    }

    const dealTerms = (id) => {
      const row = rowAt(id)
      return (row && row.kind === "deal" && row.terms) || ""
    }

    const PERMANENT_TYPE = /\b(Artifact|Battle|Creature|Enchantment|Land|Planeswalker)\b/
    const BACK_NOTE = /\b(transformed|transforms|back face|back side|night side|flip side|flipped)\b/i
    const FRONT_NOTE = /\bfront (face|side)\b/i

    const faceFromNote = (note, faces) => {
      const text = String(note || "").toLowerCase()
      if (!text) return -1
      let pick = -1
      let longest = 0
      faces.forEach((face, i) => {
        const name = String(face.name || "").toLowerCase()
        if (name && name.length > longest && text.includes(name)) {
          pick = i
          longest = name.length
        }
      })
      if (pick >= 0) return pick
      if (BACK_NOTE.test(text)) return faces.length - 1
      if (FRONT_NOTE.test(text)) return 0
      return -1
    }

    /**
     * Which printed side of a double-faced card the snapshot shows: the `face`
     * field when set, otherwise the side its `note` names, otherwise the only
     * side that can be a permanent.
     */
    const faceInPlay = (entry, info, inPlay) => {
      const faces = info.faces
      if (!Array.isArray(faces) || faces.length < 2) return null
      let pick = -1
      if (typeof entry.face === "number") pick = entry.face
      if (typeof entry.face === "string" && entry.face) {
        pick = /^front$/i.test(entry.face)
          ? 0
          : /^back$/i.test(entry.face)
            ? faces.length - 1
            : faces.findIndex((face) =>
                String(face.name || "").toLowerCase() === entry.face.trim().toLowerCase())
      }
      if (pick < 0 && inPlay) pick = faceFromNote(entry.note, faces)
      if (pick < 0 && inPlay && !PERMANENT_TYPE.test(faces[0].type_line || "")) {
        pick = faces.findIndex((face) => PERMANENT_TYPE.test(face.type_line || ""))
      }
      return faces[pick] || null
    }

    const printedPT = (info) => {
      if (info.power != null && info.toughness != null) {
        return [String(info.power), String(info.toughness)]
      }
      const front = String(info.stats || "").split(" // ")[0]
      return front.includes("/") ? front.split("/") : null
    }

    /** Printed power and toughness plus the counters the snapshot records. */
    const currentPT = (entry, info) => {
      const stated = entry.pt
        || (entry.power != null && entry.toughness != null
          ? `${entry.power}/${entry.toughness}`
          : "")
      if (stated) return { text: String(stated), modified: true }

      const printed = printedPT(info)
      if (!printed) return null
      const counters = entry.counters || {}
      const shift = (Number(counters["+1/+1"]) || 0) - (Number(counters["-1/-1"]) || 0)
      const shifted = (value) => {
        const printedValue = Number(value)
        if (Number.isFinite(printedValue)) return printedValue + shift
        return shift ? `${value}${shift > 0 ? "+" : ""}${shift}` : value
      }
      return {
        text: `${shifted(printed[0])}/${shifted(printed[1])}`,
        modified: shift !== 0,
      }
    }

    const COUNTER_GLYPHS = {
      "+1/+1": "+", "p1p1": "+", "-1/-1": "−", "m1m1": "−",
      age: "⌛", charge: "⚡", energy: "⚡", experience: "✦", fade: "⌛",
      lore: "❋", loyalty: "◆", oil: "◍", poison: "☠", quest: "★",
      shield: "⛨", stun: "✖", time: "⌛", vanishing: "⌛",
    }

    const STATUS_MARKS = [
      [/goad/i, "➤", "Goaded"],
      [/enchant|equipp|attach|aura/i, "⚯", "Attached"],
      [/copy|copies/i, "⧉", "Copy"],
      [/hast/i, "»", "Haste"],
      [/monarch|initiative/i, "♛", "Monarch"],
    ]

    /** Counter chips plus a status chip for each recognized note segment. */
    const cardMarks = (entry) => {
      const marks = Object.entries(entry.counters || {}).map(([kind, count]) => {
        const glyph = COUNTER_GLYPHS[kind] || kind.slice(0, 1).toUpperCase()
        const tone = glyph === "+" ? "plus" : glyph === "−" ? "minus" : ""
        return { tone, text: `${glyph}${count}`, label: `${kind} ×${count}` }
      })

      const notes = String(entry.note || "").split(";").map((part) => part.trim()).filter(Boolean)
      const seen = new Set()
      for (const note of notes) {
        const match = STATUS_MARKS.find(([pattern]) => pattern.test(note))
        const [, glyph, label] = match || [null, "•", "Note"]
        if (seen.has(glyph)) continue
        seen.add(glyph)
        const same = label.toLowerCase() === note.toLowerCase()
        marks.push({ tone: "status", text: glyph, label: same ? label : `${label}: ${note}` })
      }
      return { marks, notes }
    }

    const cardHtml = (name, extra = {}, inPlay = false) => {
      const full = label(name)
      const info = (extra.token_id ? tokens[extra.token_id] : catalog[full] || catalog[name]) || {}
      const face = faceInPlay(extra, info, inPlay)
      const view = face || info
      const printed = face?.name || full
      const src = view.image_small || ""
      const href = info.scryfall_uri || "#"
      const classes = `${extra.tapped ? " tapped" : ""}${extra.token ? " token" : ""}`
      const image = src
        ? `<img src="${esc(src)}" alt="${esc(printed)}">`
        : `<span style="display:block;padding:1.2rem .2rem;text-align:center;font-size:10px">${esc(printed)}</span>`
      const stats = inPlay ? currentPT(extra, view) : null
      const badge = stats
        ? `<span class="pt${stats.modified ? " modified" : ""}">${esc(stats.text)}</span>`
        : ""
      const { marks, notes } = inPlay ? cardMarks(extra) : { marks: [], notes: [] }
      const chips = marks.length
        ? `<span class="marks">${marks.map((mark) =>
            `<span class="mark ${mark.tone}" title="${esc(mark.label)}">${esc(mark.text)}</span>`
          ).join("")}</span>`
        : ""
      const detail = marks.length
        ? ` data-detail="${details.push({ name: printed, stats, entry: extra, notes }) - 1}"`
        : ""
      const title = face && face.name !== full ? `${printed} (${full})` : printed
      return `<a class="card${classes}" href="${esc(href)}" target="_blank" rel="noreferrer" title="${esc(title)}" data-preview="${esc(view.image_normal || src)}"${detail}>${image}${badge}${chips}</a>`
    }

    const zone = (title, entries, extra = "", inPlay = false) => {
      if (!entries?.length) return ""
      const cards = entries.map((entry) => {
        const name = typeof entry === "string" ? entry : entry.name
        return cardHtml(name, entry, inPlay)
      }).join("")
      return `<div class="zone${extra}"><h3>${title}</h3><div class="cards">${cards}</div></div>`
    }

    const renderSeat = (seat, player, active) => {
      player ||= {}
      return `<section class="seat ${seat.id}${active ? " active" : ""}">
        <div class="seat-head">
          <div>
            <strong>${esc(seat.name)}</strong>
            <div class="meta">${esc((player.command || []).join(", "))} · library ${player.library_count ?? "?"}</div>
          </div>
          <div class="life">${player.life ?? "?"}</div>
        </div>
        ${zone("Top of library", player.revealed_top, " revealed")}
        ${zone("Battlefield", player.battlefield, "", true)}
        ${zone("Hand", player.hand)}
        ${zone("Graveyard", player.graveyard)}
        ${zone("Command", player.command)}
      </section>`
    }

    const render = () => {
      const event = events[index] || {
        summary: "No events",
        state: { players: {}, stack: [] },
        turn: 0,
        phase: "setup",
      }
      const state = event.state || { players: {}, stack: [] }
      const stack = (state.stack || []).length
        ? state.stack.map((item) => `${esc(label(item.controller || ""))}: ${esc(label(item.name))}${item.text ? ` — ${esc(item.text)}` : ""}`).join("<br>")
        : "<span class='meta'>Empty</span>"
      const actor = seats.find((seat) => seat.id === event.seat)
      const position = `Turn ${event.turn || 0} · ${event.phase || ""} · ${index + 1}/${events.length}`
      const aside = event.notes || event.note || ""
      const think = event.decision?.reason
        ? `<p class="now-think">${esc(event.decision.reason)}</p>`
        : ""
      const talkId = event.deal?.id
      const talk = talkId != null
        ? `<p class="now-note">${esc(event.deal.action ? `${event.deal.action}: ` : "")}${esc(dealTerms(talkId) || event.deal.terms || "")}</p>`
        : event.deal?.terms
          ? `<p class="now-note">${esc(event.deal.action ? `${event.deal.action}: ` : "")}${esc(event.deal.terms)}</p>`
          : ""
      const liveDeals = (state.deals || []).filter((deal) =>
        ["open", "accepted", "counter"].includes(deal.status)
      )
      const dealsHtml = liveDeals.length
        ? `<div class="deals-panel"><h3>Deals</h3>${liveDeals.map((deal) =>
            `<p>${esc(deal.id ?? "")} · ${esc(deal.status || "")}: ${esc(dealTerms(deal.id) || deal.terms || "")}</p>`
          ).join("")}</div>`
        : ""
      details = []
      table.innerHTML = seats
        .map((seat) => renderSeat(seat, state.players[seat.id], state.active === seat.id))
        .join("") + `<div class="center">
          <div class="now-panel">
            <p class="now-meta">${esc(position)}${actor ? ` · ${esc(actor.name)}` : ""}</p>
            <p class="now-text">${esc(event.summary || "")}</p>
            ${aside ? `<p class="now-note">${esc(aside)}</p>` : ""}
            ${think}
            ${talk}
          </div>
          ${dealsHtml}
          <div class="stack-panel"><h3>Stack</h3>${stack}</div>
        </div>`
      clock.textContent = position
      slider.value = String(index)
      Array.from(log.children).forEach((item, i) => {
        item.classList.toggle("current", i === index)
      })
      log.children[index]?.scrollIntoView({ block: "nearest" })
    }

    events.forEach((event, i) => {
      const item = document.createElement("li")
      const number = document.createElement("span")
      number.className = "log-index"
      number.textContent = `${i + 1}.`
      const text = document.createElement("span")
      text.className = "log-text"
      text.textContent = event.summary || `Event ${i}`
      item.append(number, text)
      item.addEventListener("click", () => {
        index = i
        render()
      })
      log.appendChild(item)
    })

    const step = (delta) => {
      index = Math.max(0, Math.min(events.length - 1, index + delta))
      render()
    }

    document.getElementById("prev").onclick = () => step(-1)
    document.getElementById("next").onclick = () => step(1)
    slider.oninput = () => {
      index = Number(slider.value)
      render()
    }
    document.getElementById("play").onclick = (event) => {
      if (timer) {
        clearInterval(timer)
        timer = null
        event.target.textContent = "Play"
        return
      }
      event.target.textContent = "Pause"
      timer = setInterval(() => {
        if (index >= events.length - 1) {
          clearInterval(timer)
          timer = null
          event.target.textContent = "Play"
          return
        }
        step(1)
      }, 1400)
    }
    toggleLog.onclick = () => {
      const hidden = document.body.classList.toggle("log-hidden")
      toggleLog.textContent = hidden ? "Show log" : "Hide log"
      toggleLog.setAttribute("aria-expanded", String(!hidden))
    }

    const preview = document.getElementById("preview")
    const previewImage = document.getElementById("preview-image")
    const previewDetail = document.getElementById("preview-detail")

    const detailHtml = (detail) => {
      if (!detail) return ""
      const { entry, notes, stats } = detail
      const lines = []
      if (stats) lines.push([stats.modified ? "plus" : "", `${stats.text} in play`])
      if (entry.tapped) lines.push(["", "Tapped"])
      for (const [kind, count] of Object.entries(entry.counters || {})) {
        const tone = kind.startsWith("-") || kind.startsWith("m1") ? "minus" : "plus"
        lines.push([tone, `${count} ${kind} counter${count === 1 ? "" : "s"}`])
      }
      for (const note of notes) lines.push(["status", note])
      if (!lines.length) return ""
      const items = lines
        .map(([tone, text]) => `<li class="${tone}">${esc(text)}</li>`)
        .join("")
      return `<h4>${esc(detail.name)}</h4><ul>${items}</ul>`
    }

    table.addEventListener("mouseover", (event) => {
      const card = event.target.closest("[data-preview]")
      if (!card?.dataset.preview) return
      previewImage.src = card.dataset.preview
      previewDetail.innerHTML = detailHtml(details[Number(card.dataset.detail)])
      preview.classList.add("visible")
    })
    table.addEventListener("mouseout", (event) => {
      if (!event.relatedTarget || !table.contains(event.relatedTarget)) {
        preview.classList.remove("visible")
      }
    })
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" || event.key === "j") step(-1)
      if (event.key === "ArrowRight" || event.key === "k" || event.key === " ") {
        event.preventDefault()
        step(1)
      }
    })
    render()
  </script>
</body>
</html>
